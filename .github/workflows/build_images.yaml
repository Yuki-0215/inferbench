name: Build and push InferBench image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to build, for example vX.Y.Z
        required: true
        type: string

concurrency:
  group: inferbench-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: uhub.service.ucloud.cn
  IMAGE_NAME: openbayes_common/inferbench

jobs:
  build-and-push:
    name: Build linux/amd64 and linux/arm64
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate registry credentials
        env:
          UCLOUD_USER: ${{ secrets.UCLOUD_USER }}
          UCLOUD_PASS: ${{ secrets.UCLOUD_PASS }}
        run: |
          if [[ -z "${UCLOUD_USER}" || -z "${UCLOUD_PASS}" ]]; then
            echo "::error::Configure UCLOUD_USER and UCLOUD_PASS in repository Actions secrets."
            exit 1
          fi

      - name: Resolve image tag
        id: image
        env:
          MANUAL_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            image_tag="${GITHUB_REF_NAME}"
          else
            image_tag="${MANUAL_IMAGE_TAG}"
          fi

          if [[ ! "${image_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Image tag must be a semantic version such as vX.Y.Z."
            exit 1
          fi

          echo "tag=${image_tag}" >> "${GITHUB_OUTPUT}"
          echo "Building ${REGISTRY}/${IMAGE_NAME}:${image_tag}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to UCloud registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.UCLOUD_USER }}
          password: ${{ secrets.UCLOUD_PASS }}

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Publish build summary
        run: |
          echo "### InferBench image published" >> "${GITHUB_STEP_SUMMARY}"
          echo '```text' >> "${GITHUB_STEP_SUMMARY}"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          echo "Platforms: linux/amd64, linux/arm64" >> "${GITHUB_STEP_SUMMARY}"
