[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "inferbench-local"
version = "0.1.5"
description = "Local-first benchmark console for vLLM, SGLang and OpenAI-compatible inference servers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx[socks]>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9", "pytest-asyncio>=0.23,<1", "playwright>=1.48,<2"]

[project.scripts]
inferbench = "inferbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["inferbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
